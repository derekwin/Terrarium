[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/guest-proxy",
    "crates/mcp",
    "crates/adapter/traits",
    "crates/adapter/cloud-hypervisor",
    "crates/adapter/sandlock",
    "crates/adapter/openshell",
    "crates/network",
    "crates/protocol",
    "crates/fs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/terrarium/Terrarium"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
