name: CI

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Verify Cargo.lock is up-to-date
      - run: cargo build --all --locked

      # Formatting
      - run: cargo fmt --all -- --check

      # Linting (warnings as errors)
      - run: cargo clippy --all-targets -- -D warnings

      # Tests
      - run: cargo test --all

      # Security audit
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build PyO3 engine
        run: |
          pip install maturin
          cd crates/engine && maturin develop
      - run: pip install -e sdk/python/
      - run: python -c "import terra; print('SDK OK')"
