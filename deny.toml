[advisories]
yanked = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# syn 3.0.3 pulled by async-trait 0.1.91 (proc-macro); the rest of the
# dependency graph uses syn 2.x
skip = [
    { name = "syn", version = "3.0.3", reason = "required by async-trait 0.1.91 proc-macro" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
