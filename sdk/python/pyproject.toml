# NOTE: This pyproject.toml is for standalone SDK installs.
# For unified builds (Rust extensions + SDK), use the root pyproject.toml:
#   pip install -e .          # dev mode (editable)
#   python -m build --wheel   # produces self-contained wheel
#
# Standalone SDK install (Python only, no Rust extensions):
#   pip install -e sdk/python
#
# Individual crate maturin builds still work:
#   cd crates/engine && maturin build --release
#   cd crates/fs && maturin build --release
[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "terra-sdk"
version = "0.1.0"
description = "Terrarium Engine Python SDK — agent sandbox orchestration"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Apache-2.0" }

# Backend extras. They are markers for which host backend(s) you plan to
# use — heavy host binaries (cloud-hypervisor, virtiofsd, erofs-utils)
# are NOT pip packages, so the SDK downloads them into ~/.local/share/terra
# on first use (see terra.assets). Extras only pull pip-side companions.
[project.optional-dependencies]
ch = []
sandlock = ["sandlock>=0.8"]

[project.scripts]
terra = "terra.__main__:main"

[tool.setuptools.packages.find]
include = ["terra*"]
