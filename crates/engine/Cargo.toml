[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "terrarium_engine"
crate-type = ["cdylib", "lib"]

[dependencies]
adapter-cloud-hypervisor = { path = "../adapter/cloud-hypervisor", version = "0.1.0" }
adapter-traits = { path = "../adapter/traits", version = "0.1.0" }
terrarium-network = { path = "../network", version = "0.1.0" }
terrarium-protocol = { path = "../protocol", version = "0.1.0" }
pyo3 = "0.29"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
