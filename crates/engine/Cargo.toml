[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "terrarium_engine"
crate-type = ["cdylib", "lib"]

[dependencies]
adapter-cloud-hypervisor = { path = "../adapter/cloud-hypervisor", version = "0.1.0" }
adapter-confine = { path = "../adapter/confine", version = "0.1.0" }
adapter-sandlock = { path = "../adapter/sandlock", version = "0.1.0", optional = true }
adapter-traits = { path = "../adapter/traits", version = "0.1.0" }
async-trait = "0.1"
terrarium-network = { path = "../network", version = "0.1.0" }
terrarium-protocol = { path = "../protocol", version = "0.1.0" }
pyo3 = "0.29"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[features]
default = []
# L2 sandbox backend: native terra-confine is built in by default; enable
# "sandlock" to select the sandlock alternative via
# `default_sandbox_adapter` (or inject any backend with
# `VmManager::with_sandbox_adapter`).
sandlock = ["dep:adapter-sandlock"]
